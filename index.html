<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCEEH — Gestion des habitants</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css"/>
  <script>
    function applicationPrincipale() {
      return {
        utilisateurCharge: false,
        erreurInitialisation: "",
        chargementPage: false,
        sectionActive: "dashboard",
        sections: [
          { id: "dashboard", libelle: "Tableau de bord", url: "pages/dashboard.html?v=20260817-3" },
          { id: "habitants", libelle: "Gestion des habitants", url: "pages/habitants.html?v=20260826-2" },
          { id: "bilans", libelle: "Bilans statistiques", url: "pages/bilans.html?v=20260826-2" },
          { id: "referentiels", libelle: "Gestion des référentiels", url: "pages/referentiels.html?v=20260826-2" },
        ],
        _protegerPage: null,
        _deconnexion: null,
        _versionNavigation: 0,

        async init() {
          try {
            const [{ protegerPage, deconnexion }, { assurerAmorcageReferentiels }] = await Promise.all([
                import("./js/firebase-init.js"),
                import("./js/seed-referentiels.js?v=20260826-2"),
             ]);
            this._deconnexion = deconnexion;
            history.replaceState({ section: "dashboard", vue: "liste" }, "");
            
            window.addEventListener("popstate", (event) => {
            const section = event.state?.section || "dashboard";
            const vue = event.state?.vue || "liste";
            // Retour depuis une fiche habitant vers la liste.
            if (this.sectionActive === "habitants" && section === "habitants" && vue === "liste") {
              const composant = document.querySelector("#zone-affichage > [x-data]");
              const page = composant ? Alpine.$data(composant) : null;
              if (page?.vue === "fiche") page.revenirALaListe(false);
              return;
            }
            // Retour vers une autre section enregistrée dans l'historique.
            if (section !== this.sectionActive) this.allerA(section, false);
          });
  
            protegerPage(async () => {
              try {
                await assurerAmorcageReferentiels();
                this.utilisateurCharge = true;
                await this.allerA("dashboard", false);
              } catch (erreur) {
                this.erreurInitialisation = "Impossible d'initialiser l'application.";
              }
            });
          } catch (erreur) {
            this.erreurInitialisation = "Impossible de charger l'application.";
          }
        },

        async allerA(idSection, gererHistorique = true) {
          const section = this.sections.find((s) => s.id === idSection);
          if (!section) return;
          const ancienneSection = this.sectionActive;
          this.sectionActive = idSection;

          if (gererHistorique && idSection !== ancienneSection) {
            history.pushState({ section: idSection, vue: "liste" }, "");
          }

          const versionNavigation = ++this._versionNavigation;
          this.chargementPage = true;
          const conteneur = document.getElementById("zone-affichage");
          try {
            const reponse = await fetch(section.url);
            if (!reponse.ok) {
              throw new Error(`Chargement impossible (${reponse.status})`);
            }

            const html = await reponse.text();
            if (versionNavigation !== this._versionNavigation) return;
            const template = document.createElement("template");
            template.innerHTML = html;

            await this._executerScriptsDuFragment(conteneur, template.content);
            if (versionNavigation !== this._versionNavigation) return;
            conteneur.replaceChildren(template.content);
            window.Alpine.initTree(conteneur);
          } catch (erreur) {
            if (versionNavigation !== this._versionNavigation) return;
            conteneur.innerHTML = `
              <div class="rounded-md bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">
                Impossible de charger cette page. Vérifiez votre connexion et réessayez.
              </div>`;
          } finally {
            if (versionNavigation === this._versionNavigation) {
              window.Alpine.startObservingMutations();
              this.chargementPage = false;
            }
          }
        },

        async _executerScriptsDuFragment(conteneur, fragment) {
          window.Alpine.stopObservingMutations();
          window.Alpine.destroyTree(conteneur);
          const scripts = [...fragment.querySelectorAll("script")];
          for (const ancien of scripts) {
            const nouveau = document.createElement("script");
            if (ancien.type) nouveau.type = ancien.type;
            if (ancien.src) nouveau.src = ancien.src;
            else nouveau.textContent = ancien.textContent;
            await new Promise((resoudre, rejeter) => {
              nouveau.onload = resoudre;
              nouveau.onerror = () => rejeter(new Error("Impossible d’exécuter le script de page."));
              document.head.appendChild(nouveau);
              ancien.remove();
              if (!nouveau.src) resoudre();
            });
            nouveau.remove();
          }
        },

        async seDeconnecter() {
          await this._deconnexion();
          window.location.href = "login.html";
        },
      };
    }
    window.applicationPrincipale = applicationPrincipale;
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div x-data="applicationPrincipale()">
    <!-- Écran de chargement initial (authentification + amorçage des référentiels). Visible par défaut, dès le premier rendu HTML avant même qu'Alpine.js soit chargé.  -->
    <div x-show="!utilisateurCharge && !erreurInitialisation" class="min-h-screen flex items-center justify-center">
      <svg class="animate-spin h-10 w-10 text-slate-400" viewBox="0 0 24 24" fill="none">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
      </svg>
    </div>

    <div x-show="erreurInitialisation" x-cloak class="min-h-screen flex items-center justify-center px-6">
      <div class="rounded-md bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3" x-text="erreurInitialisation"></div>
    </div>

    <div x-show="utilisateurCharge" x-cloak class="min-h-screen flex flex-col">
      <header class="bg-slate-800 text-white no-print">
        <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
          <div class="flex items-center gap-8">
            <span class="font-semibold tracking-wide">CCEEH</span>
            <nav class="flex gap-1">
              <template x-for="item in sections" :key="item.id">
                <button @click="allerA(item.id)" :class="sectionActive === item.id ? 'bg-slate-700 text-white' : 'text-slate-300 [@media(hover:hover)]:hover:bg-slate-700 [@media(hover:hover)]:hover:text-white'"
                  class="px-3 py-1.5 rounded-md text-sm font-medium transition-colors" x-text="item.libelle">
                </button>
              </template>
            </nav>
          </div>
          <button @click="seDeconnecter()"
            class="text-sm text-slate-300 hover:text-white transition-colors">Déconnexion
          </button>
        </div>
      </header>
      <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-6">
        <!-- Indicateur de chargement pendant le fetch d'une page fille -->
        <div x-show="chargementPage" x-cloak class="flex justify-center py-16">
          <svg class="animate-spin h-6 w-6 text-slate-400" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
        </div>
        <div x-show="!chargementPage" id="zone-affichage"></div>
      </main>
    </div>
  </div>
</body>
</html>
